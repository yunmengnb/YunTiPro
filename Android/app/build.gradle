plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('signing/release.properties')
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { name ->
        if (!signingProperties.getProperty(name)) {
            throw new GradleException("Missing local signing property: ${name}")
        }
    }
}
android {
    namespace 'cloud.yimeng.kitsune'
    compileSdk 35
    defaultConfig { applicationId 'cloud.yimeng.kitsune'; minSdk 29; targetSdk 35; versionCode 3; versionName '1.1.3' }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    signingConfigs {
        release {
            if (signingPropertiesFile.isFile()) {
                storeFile rootProject.file(signingProperties.getProperty('storeFile'))
                storePassword signingProperties.getProperty('storePassword')
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
                storeType 'PKCS12'
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    testOptions { unitTests.returnDefaultValues = true }
}
tasks.register('requireReleaseSigning') {
    doLast {
        if (!signingPropertiesFile.isFile()) {
            throw new GradleException('Release signing requires local signing/release.properties; run scripts/Initialize-Signing.ps1 first.')
        }
    }
}
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') { task.dependsOn('requireReleaseSigning') }
}
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar'])
    // 二维码生成与识别
    implementation 'com.google.zxing:core:3.5.3'
    // CameraX 扫码预览与逐帧分析
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
